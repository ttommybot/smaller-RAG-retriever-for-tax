<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG对话系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        neutral: '#f1f5f9',
                        dark: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fa fa-comments-o mr-2"></i>
                RAG对话系统
            </h1>
            <div class="text-sm opacity-80">
                基于检索增强生成
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- 对话历史区域 -->
            <div id="chat-history" class="h-[500px] overflow-y-auto scrollbar-hide p-4 bg-gray-50">
                <!-- 系统欢迎消息 -->
                <div class="flex mb-4">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white">
                        <i class="fa fa-robot"></i>
                    </div>
                    <div class="ml-3 bg-white p-3 rounded-lg shadow-sm max-w-[80%]">
                        <p class="text-gray-700">你好！我是RAG对话系统，请问有什么可以帮助你的？</p>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="border-t p-4 bg-white">
                <form id="chat-form" class="flex items-center">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="请输入你的问题..." 
                        class="flex-grow border border-gray-300 rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50"
                    >
                    <button 
                        type="submit" 
                        class="bg-primary text-white px-6 py-2 rounded-r-lg hover:bg-primary/90 transition-colors"
                    >
                        <i class="fa fa-paper-plane mr-1"></i> 发送
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- 底部信息 -->
    <footer class="bg-dark text-white py-4">
        <div class="container mx-auto px-4 text-center text-sm opacity-70">
            © 2026 RAG对话系统 | 课程项目
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
