<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG对话系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                        neutral: '#f1f5f9',
                        dark: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- 顶部导航栏 -->
    <header class="bg-primary text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center">
                <i class="fa fa-comments-o mr-2"></i>
                RAG对话系统
            </h1>
            <div class="text-sm opacity-80">
                基于检索增强生成
            </div>
        </div>
    </header>

    <!-- 主要内容区 -->
    <main class="flex-grow container mx-auto px-4 py-6">
        <div class="max-w-3xl mx-auto">
            <!-- 配置面板 -->
            <div class="bg-white rounded-lg shadow-lg p-4 mb-4">
                <div class="flex flex-wrap items-center gap-4">
                    <!-- 模型选择 -->
                    <div class="flex items-center gap-2">
                        <label class="text-sm font-medium text-gray-700">
                            <i class="fa fa-cube mr-1"></i> 模型：
                        </label>
                        <select id="model-select" class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 min-w-[200px]">
                            <option value="">请选择模型...</option>
                        </select>
                    </div>

                    <!-- Chunk方法选择 -->
                    <div class="flex items-center gap-2">
                        <label class="text-sm font-medium text-gray-700">
                            <i class="fa fa-puzzle-piece mr-1"></i> Chunk：
                        </label>
                        <select id="chunk-select" class="border border-gray-300 rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/50 min-w-[100px]">
                            <option value="semantic">semantic</option>
                            <option value="sliding">sliding</option>
                        </select>
                    </div>

                    <!-- Reranker开关 -->
                    <div class="flex items-center gap-2">
                        <label class="text-sm font-medium text-gray-700">
                            <i class="fa fa-sort mr-1"></i> Reranker：
                        </label>
                        <button id="reranker-toggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-300 transition-colors focus:outline-none">
                            <span id="reranker-indicator" class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1"></span>
                        </button>
                        <span id="reranker-status" class="text-sm text-gray-500">关闭</span>
                    </div>

                    <!-- 应用配置按钮 -->
                    <button id="apply-config" class="bg-primary text-white px-4 py-1.5 rounded text-sm hover:bg-primary/90 transition-colors">
                        <i class="fa fa-check mr-1"></i> 应用配置
                    </button>
                </div>

                <!-- 配置状态显示 -->
                <div id="config-status" class="mt-3 text-sm text-gray-500 hidden">
                    <i class="fa fa-info-circle mr-1"></i>
                    <span id="config-info"></span>
                </div>
            </div>

            <!-- 对话区域 -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <!-- 对话历史区域 -->
                <div id="chat-history" class="h-[400px] overflow-y-auto scrollbar-hide p-4 bg-gray-50">
                    <!-- 系统欢迎消息 -->
                    <div class="flex mb-4">
                        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white">
                            <i class="fa fa-robot"></i>
                        </div>
                        <div class="ml-3 bg-white p-3 rounded-lg shadow-sm max-w-[80%]">
                            <p class="text-gray-700">你好！我是RAG对话系统。</p>
                            <p class="text-gray-500 text-sm mt-1">请先在上方选择模型配置，然后开始提问。</p>
                        </div>
                    </div>
                </div>

                <!-- 输入区域 -->
                <div class="border-t p-4 bg-white">
                    <form id="chat-form" class="flex items-center">
                        <input
                            type="text"
                            id="user-input"
                            placeholder="请输入你的问题..."
                            class="flex-grow border border-gray-300 rounded-l-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary/50"
                        >
                        <button
                            type="submit"
                            class="bg-primary text-white px-6 py-2 rounded-r-lg hover:bg-primary/90 transition-colors"
                        >
                            <i class="fa fa-paper-plane mr-1"></i> 发送
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部信息 -->
    <footer class="bg-dark text-white py-4">
        <div class="container mx-auto px-4 text-center text-sm opacity-70">
            © 2026 RAG对话系统 | 课程项目
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
