# RAG for Tax 项目配置文件
#
# 注意：敏感信息（如 API key）已移至 configs_local.yaml 文件
# 该文件可以安全提交到 Git

project_name: "rag_for_tax"

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  vector_db_dir: "vectordb"

chunking:
  chunk_size: 300
  chunk_overlap: 100
  min_chunk: 100

embedding:
  model_large_name: "BAAI/bge-large-zh-v1.5"
  model_small_name: "sentence-transformers/all-MiniLM-L6-v2"
  model_student_name: "sentence-transformers/all-MiniLM-L6-v2"
  model_teacher_name: "BAAI/bge-reranker-v2-gemma"

retrieval:
  top_k: 5

models:
  # 生成器后端类型：dummy / aliyun / huggingface / openai / ollama
  generator_backend: "aliyun"
  # 生成器模型名称
  generator_model_name: "qwen-max"

app:
  show_sources: true

# 问题集生成配置（非敏感项）
query:
  # 种子问题文件（clean.py 输入）
  seed_file: "data/query/seed_questions_cleaned.txt"
  # 原始问题文件（clean.py 输入）
  input_file: "seed_questions.txt"
  # 干净问题文件（clean.py 输出）
  output_file: "data/query/seed_questions_cleaned.txt"
  # 输出目录（generate_dataset.py 输出）
  output_dir: "data/query"
  # 每条种子生成的问题数量
  generate_per_seed: 6
  # 并发限制
  concurrent_limit: 15
  # 数据集规模定义
  dataset_sizes:
    small: 200
    medium: 500
    large: 1000

# FFT 训练配置
fft:
  chunk_methods:
    - semantic
    - sliding
  margins:
    - 0.3
    - 0.4
    - 0.5
  batch_size: 64
  warmup_ratio: 0.1
  max_epochs: 20
  patience: 3
